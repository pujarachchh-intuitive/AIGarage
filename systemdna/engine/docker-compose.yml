services:
  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10

  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  engine:
    build: .
    command: python -m core.scanner
    volumes:
      - repo_workspace:/workspace
    env_file: .env
    depends_on:
      - neo4j
      - chroma
      - redis

  api:
    build: .
    command: uvicorn server.app:app --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    volumes:
      - repo_workspace:/workspace
    env_file: .env
    depends_on:
      - neo4j
      - chroma
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  mcp:
    build: .
    command: python mcp/server.py
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      - api

volumes:
  neo4j_data:
  chroma_data:
  repo_workspace:
